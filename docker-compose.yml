version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: local-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: "1414"
    volumes:
      - mysqldata:/var/lib/mysql

  localstack:
    container_name: localstack_api
    image: localstack/localstack:3.0.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  mysqldata:
